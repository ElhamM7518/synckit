spring.application.name=synckit
server.port=8080

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.datasource.url=jdbc:postgresql://localhost:5433/synckit
spring.datasource.username=synckit
spring.datasource.password=synckit

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

synckit.jwt.secret=${JWT_SECRET:synckit-dev-secret-change-me-please-32bytes-min}
synckit.jwt.expiration-ms=86400000
